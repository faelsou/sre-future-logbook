
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diario-sre
  labels:
    app: diario-sre
spec:
  replicas: 3
  selector:
    matchLabels:
      app: diario-sre
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: diario-sre
    spec:
      containers:
      - name: diario-sre
        image: ${DOCKER_REGISTRY}/diario-sre:${IMAGE_TAG}
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
