
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diario-sre-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - diario-sre.example.com
    secretName: diario-sre-tls
  rules:
  - host: diario-sre.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: diario-sre
            port:
              number: 80
